<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>V.I.S.O.R — Protótipo</title>
<style>
  :root{
    --bg: #05080a;
    --panel: #0a1114;
    --line: #1c3a3f;
    --accent: #4fd8e8;
    --accent-dim: #245b63;
    --warn: #e8794f;
    --text: #d9f4f7;
    --text-dim: #6f9aa0;
    --font-display: 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Consolas', 'SF Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse at center, #0b1518 0%, var(--bg) 70%);
    color: var(--text);
    font-family: var(--font-display);
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  .rig{
    width:100%;
    max-width: 760px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
  }
  .header h1{
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--accent);
  }
  .header .status{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .status.live{ color: var(--accent); }

  .stage{
    position: relative;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 4/3;
  }
  .stage video{
    width:100%; height:100%; object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.92;
  }
  .stage canvas{ display:none; }

  .reticle{
    position:absolute; inset: 0;
    pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .reticle .ring{
    width: 46%;
    aspect-ratio: 1;
    border: 1px solid var(--accent-dim);
    border-radius: 50%;
    opacity: 0.5;
  }
  .reticle .ring::before, .reticle .ring::after{
    content:'';
    position:absolute;
  }
  .corner{
    position:absolute; width:22px; height:22px;
    border: 2px solid var(--accent);
    opacity: 0.8;
  }
  .corner.tl{ top:10px; left:10px; border-right:none; border-bottom:none; }
  .corner.tr{ top:10px; right:10px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:10px; left:10px; border-right:none; border-top:none; }
  .corner.br{ bottom:10px; right:10px; border-left:none; border-top:none; }

  .listening-badge{
    position:absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--warn);
    color: var(--warn);
    padding: 4px 10px;
    border-radius: 3px;
    display:none;
  }
  .listening-badge.on{ display:block; }

  .console{
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    padding: 14px 16px;
    min-height: 84px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
  }
  .console .you{ color: var(--text-dim); }
  .console .visor{ color: var(--accent); }
  .console .empty{ color: var(--text-dim); font-style: italic; }

  .controls{
    display:flex;
    align-items:center;
    gap: 14px;
  }
  button{
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 14px 22px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    user-select: none;
  }
  button:hover{ background: rgba(79,216,232,0.1); }
  button:active, button.recording{
    background: var(--accent);
    color: #06282c;
  }
  button:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }
  .hint{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .setup{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .setup a{ color: var(--accent); }
</style>
</head>
<body>
<div class="rig">

  <div class="header">
    <h1>V.I.S.O.R — protótipo</h1>
    <div class="status" id="status">iniciando…</div>
  </div>

  <div class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="reticle"><div class="ring"></div></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="listening-badge" id="listeningBadge">● ouvindo</div>
  </div>

  <div class="console" id="console"><span class="empty">Segure o botão, aponte a câmera e pergunte algo.</span></div>

  <div class="controls">
    <button id="talkBtn">🎙 Segurar para falar</button>
    <span class="hint" id="hint">clique e segure, fale, solte</span>
  </div>

  <div class="setup" id="setupNote"></div>

</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const talkBtn = document.getElementById('talkBtn');
const statusEl = document.getElementById('status');
const consoleEl = document.getElementById('console');
const listeningBadge = document.getElementById('listeningBadge');
const setupNote = document.getElementById('setupNote');

let recognizing = false;
let recognition = null;
let sttSupported = true;

function setStatus(text, live){
  statusEl.textContent = text;
  statusEl.className = 'status' + (live ? ' live' : '');
}

// ---- Câmera ----
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = stream;
    setStatus('câmera ativa', true);
  }catch(err){
    setStatus('câmera indisponível');
    setupNote.innerHTML = 'Não consegui acessar a câmera (' + err.message + '). Verifique as permissões do navegador.';
  }
}
startCamera();

function captureFrame(){
  const w = video.videoWidth, h = video.videoHeight;
  if(!w || !h) return null;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  // espelha de volta pra ficar igual ao que a câmera realmente vê
  ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
}

// ---- Reconhecimento de voz (Web Speech API) ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SpeechRecognition){
  sttSupported = false;
  setupNote.innerHTML = 'Seu navegador não suporta reconhecimento de voz (Web Speech API). Isso funciona melhor no Chrome desktop.';
  talkBtn.disabled = true;
}else{
  recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = async (event) => {
    const transcript = event.results[0][0].transcript;
    await handleQuestion(transcript);
  };
  recognition.onerror = (event) => {
    stopListeningUI();
    if(event.error === 'no-speech'){
      addToConsole('visor', 'Não peguei nenhuma fala. Tenta de novo.');
    }else{
      addToConsole('visor', 'Erro no reconhecimento de voz: ' + event.error);
    }
  };
  recognition.onend = () => { stopListeningUI(); };
}

function startListeningUI(){
  recognizing = true;
  talkBtn.classList.add('recording');
  talkBtn.textContent = '● Ouvindo…';
  listeningBadge.classList.add('on');
}
function stopListeningUI(){
  recognizing = false;
  talkBtn.classList.remove('recording');
  talkBtn.textContent = '🎙 Segurar para falar';
  listeningBadge.classList.remove('on');
}

talkBtn.addEventListener('mousedown', () => {
  if(!sttSupported || recognizing) return;
  startListeningUI();
  recognition.start();
});
talkBtn.addEventListener('mouseup', () => {
  if(recognition && recognizing) recognition.stop();
});
// suporte touch (mobile)
talkBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if(!sttSupported || recognizing) return;
  startListeningUI();
  recognition.start();
});
talkBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  if(recognition && recognizing) recognition.stop();
});

// ---- Console de conversa ----
function addToConsole(who, text){
  if(consoleEl.querySelector('.empty')) consoleEl.innerHTML = '';
  const line = document.createElement('div');
  line.innerHTML = (who === 'you' ? '<span class="you">você ▸ </span>' : '<span class="visor">visor ▸ </span>') + escapeHtml(text);
  consoleEl.appendChild(line);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---- Fala de resposta (TTS do navegador) ----
function speak(text){
  if(!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'pt-BR';
  utter.rate = 1.02;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

// ---- Pergunta -> câmera + LLM ----
async function handleQuestion(transcript){
  addToConsole('you', transcript);
  const imageB64 = captureFrame();
  if(!imageB64){
    addToConsole('visor', 'Ainda não consegui capturar imagem da câmera.');
    return;
  }

  setStatus('processando…', true);
  talkBtn.disabled = true;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [
          {
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: "image/jpeg", data: imageB64 } },
              { type: "text", text: "Você é um assistente visual estilo Jarvis. Responda em português do Brasil, de forma direta e natural, em 1 a 3 frases. Pergunta do usuário, olhando para a imagem da câmera: " + transcript }
            ]
          }
        ]
      })
    });

    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    const answer = textBlocks.join(' ').trim() || 'Não consegui gerar uma resposta.';

    addToConsole('visor', answer);
    speak(answer);
  }catch(err){
    addToConsole('visor', 'Erro ao consultar o modelo: ' + err.message);
  }finally{
    setStatus('câmera ativa', true);
    talkBtn.disabled = false;
  }
}
</script>
</body>
</html>
